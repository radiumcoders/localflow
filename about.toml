# cargo-about: the Rust crates in THIRD_PARTY_LICENSES.md (see about.hbs).
# Regenerate after changing dependencies:
#
#     cargo about generate --locked -m crates/app/Cargo.toml about.hbs -o THIRD_PARTY_LICENSES.md
#
# Only licenses listed here are accepted: a dependency under any other fails
# the generation, so a new license is a decision, not an accident.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "NCSA",
]
# What the installers are built for.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
# Tools that run during the build aren't shipped in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# localflow's own crates (publish = false) are under its own license.
private = { ignore = true }
