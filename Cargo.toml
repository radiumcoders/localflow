[workspace]
resolver = "3"
members = ["crates/llm", "crates/core", "crates/speech", "crates/desktop", "crates/app", "crates/testbox", "crates/xtask"]
default-members = ["crates/llm", "crates/core", "crates/speech", "crates/desktop", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/radiumcoders/localflow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
