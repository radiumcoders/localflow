[package]
name = "xtask"
description = "localflow's build and test tasks: cargo xtask package | e2e | installed"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
ureq = "2.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
