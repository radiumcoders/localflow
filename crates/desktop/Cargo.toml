[package]
name = "localflow-desktop"
description = "localflow's desktop plumbing: where you're dictating (app, project, files), paste and clipboard, hotkeys, and learning from your fixes"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
localflow-core = { path = "../core" }
regex = "1.11"
serde_json = "1.0"

# Editors keep their open folders and Cursor its chat history in SQLite. Linux
# and Windows build SQLite in (no system library to depend on); macOS has one.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
rusqlite = "0.37"
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
