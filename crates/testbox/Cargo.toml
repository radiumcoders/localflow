[package]
name = "localflow-testbox"
description = "A text box for localflow's end-to-end tests: dictation pastes into it, it says what it got"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[dependencies]
gpui-kit = "0.7.0"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
