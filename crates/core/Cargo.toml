[package]
name = "localflow-core"
description = "localflow's dictation cleanup with its own model, localflow-clean, on this computer; learned words"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
# The cleanup model on the GPU through Vulkan (Linux, Windows).
vulkan = ["localflow-llm/vulkan"]

[dependencies]
localflow-llm = { path = "../llm" }
regex = "1.11"

[dev-dependencies]
serde_json = "1.0"
