[package]
name = "localflow-core"
description = "localflow's dictation cleanup with its own model, localflow-clean, on this computer; learned words"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false

[features]
# The cleanup model on the GPU through Vulkan (Linux, Windows).
vulkan = ["localflow-llm/vulkan"]

[dependencies]
localflow-llm = { path = "../llm" }
regex = "1.11"
# Diagrams with Claude Haiku (your API key): the Messages API.
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }

