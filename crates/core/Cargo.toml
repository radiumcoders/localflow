[package]
name = "localflow-core"
description = "localflow's dictation cleanup: its own model on this computer, or rules, few-shot examples, provider clients and a review pass; learned words"
version.workspace = true
edition.workspace = true
repository.workspace = true

[features]
# The cleanup model on the GPU through Vulkan (Linux, Windows).
vulkan = ["localflow-llm/vulkan"]

[dependencies]
localflow-llm = { path = "../llm" }
regex = "1.11"
serde_json = "1.0"
ureq = { version = "2.12", features = ["json"] }
