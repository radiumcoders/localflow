[package]
name = "localflow-llm"
description = "localflow's cleanup model in-process: llama.cpp in a library of its own, embedded in the binary"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
# The model on the GPU through Vulkan (Linux, Windows): needs the Vulkan
# headers and glslc at build time. Metal is always on for macOS.
vulkan = []

[dependencies]
libloading = "0.8"
zstd = "0.13"

[build-dependencies]
cmake = "0.1"
zstd = "0.13"
