name: rust

# The Rust rewrite (rust/): tests, including parity with the Python version,
# and clippy on every OS it has to run on.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ALSA headers (the microphone on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Parity fixture is up to date with the Python version
        shell: bash
        run: |
          python crates/core/tests/parity.py
          git diff --exit-code -- crates/core/tests/parity.json
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        shell: bash
        run: |
          cargo build --locked --release
          ls -l target/release/localflow*
