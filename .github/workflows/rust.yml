name: rust

# localflow (crates/): tests, including parity with the Python version, and
# clippy on every OS it has to run on.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux headers (ALSA for the microphone; Wayland, X11, xkbcommon and fontconfig for the UI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev
      - name: Parity fixture is up to date with the Python version
        shell: bash
        run: |
          python crates/core/tests/parity.py
          git diff --exit-code -- crates/core/tests/parity.json
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release build
        shell: bash
        run: |
          cargo build --locked --release
          ls -l target/release/localflow*
