name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Installer parses
        run: python install.py --help
      - name: dictate self-test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python dictate --selftest 3
      - name: dictate self-test (overlay, focus, clipboard, hotkey)
        if: runner.os != 'Linux'
        run: python dictate --selftest 3

  e2e:
    # install.py on a fresh machine, then a spoken sentence through the whole
    # pipeline into a text box (see tests/e2e.py).
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux packages (X11 display and paste, text-to-speech, Handy's libraries)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xclip xdotool espeak-ng ffmpeg libwebkit2gtk-4.1-0 libgtk-3-0t64 libvulkan1
      - name: End to end (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/e2e.py
      - name: End to end
        if: runner.os != 'Linux'
        run: python tests/e2e.py
      - name: dictate log
        if: always()
        shell: bash
        run: cat ~/.local/state/localflow/dictate.log ~/Library/Logs/localflow/dictate.log "$LOCALAPPDATA/localflow/dictate.log" 2>/dev/null || true
