name: package

# The Windows installer: build the .msi, install it on a fresh machine and
# check the installed app (tests/msi.py). A v* tag also publishes it as a
# GitHub release.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-msi:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build tools
        run: |
          python -m pip install pyinstaller==6.19.0 pillow==11.3.0
          dotnet tool install --global wix --version 5.0.2
      - name: Version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then v=${GITHUB_REF#refs/tags/v}; else v=0.0.$GITHUB_RUN_NUMBER; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build
        run: python pkg/build.py --version $env:VERSION
      - name: Install, set up, run and uninstall
        run: python tests/msi.py build/localflow-$env:VERSION-x64.msi
      - name: Logs
        if: always()
        shell: bash
        run: cat "$LOCALAPPDATA/localflow/app.log" "$LOCALAPPDATA/localflow/dictate.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: localflow-${{ env.VERSION }}-windows
          path: build/localflow-*.msi
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" build/localflow-*.msi --title "localflow $VERSION" --generate-notes
