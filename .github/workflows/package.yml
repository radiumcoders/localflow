name: package

# The installers: build the Windows .msi, the macOS .dmg (Apple Silicon and
# Intel) and the Linux AppImage with `cargo xtask package`, install each on a
# fresh machine and check the installed app (`cargo xtask installed`). A v*
# tag also publishes them as a GitHub release.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest       # Apple Silicon
            name: macos-arm64
          - os: macos-15-intel     # Intel
            name: macos-x64
          - os: ubuntu-24.04
            name: linux
            features: vulkan       # transcription on the GPU
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-portable-ggml
      - name: Version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then v=${GITHUB_REF#refs/tags/v}; else v=0.0.$GITHUB_RUN_NUMBER; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: WiX (the .msi)
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2
      - name: Linux packages (headers to build, Vulkan shaders; Xvfb, paste tools, speech to test)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev glslc \
            xvfb xclip xdotool espeak-ng ffmpeg mesa-vulkan-drivers libvulkan1 libfuse2t64
      - name: Build
        shell: bash
        run: cargo xtask package --version "$VERSION" ${{ matrix.features && format('--features {0}', matrix.features) || '' }}
      - name: Install, set up, check, remove (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo xtask installed build/localflow-$VERSION-x86_64.AppImage
      - name: Install, set up, check, remove
        if: runner.os != 'Linux'
        shell: bash
        run: cargo xtask installed build/localflow-"$VERSION"-*.$([[ $RUNNER_OS == Windows ]] && echo msi || echo dmg)
      - name: Log
        if: always()
        shell: bash
        run: cat "$LOCALAPPDATA/localflow/dictate.log" ~/Library/Logs/localflow/dictate.log ~/.local/state/localflow/dictate.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: localflow-${{ env.VERSION }}-${{ matrix.name }}
          path: |
            build/localflow-*.msi
            build/localflow-*.dmg
            build/localflow-*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: localflow-*
          merge-multiple: true
          path: installers
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" \
            --title "localflow ${GITHUB_REF_NAME#v}" --notes-file - <<'EOF'
          localflow, a native app written in Rust, with its own speech engine. The first time you open it, a short onboarding walks you through it: a speech model (it downloads while you go on), where cleanup runs (on this computer with Ollama, which it installs for you if it isn't there, or with your API key), what macOS asks to allow, your keys on Linux, and a dictation you try right in the window.

          **Windows:** `localflow-…-x64.msi`. Open it, then open localflow from the Start menu: the first time, the onboarding opens. The installer isn't signed yet: in the SmartScreen warning, click **More info**, then **Run anyway**.

          **macOS:** `…-arm64.dmg` for Apple Silicon (M1 and later), `…-x64.dmg` for Intel. Open it, drag localflow into Applications, and open it from there. It isn't signed with an Apple Developer ID yet: the first time, macOS says it can't check it. Open **System Settings > Privacy & Security** and click **Open Anyway** next to localflow. The onboarding then asks you to allow it under Accessibility (for the hotkey and pasting) and Microphone.

          **Linux:** `localflow-…-x86_64.AppImage`. Make it executable (`chmod +x`) and run it: the onboarding opens, copies localflow to `~/.local/share/localflow/app`, adds it to your app launcher, and shows the key bindings to add (Hyprland lines, with a Copy button). Needs PipeWire or ALSA for recording, and `wl-clipboard` + `wtype` (Wayland) or `xclip` + `xdotool` (X11) for pasting.

          Hold the hotkey (Ctrl+Shift+Space on Windows, Option+Shift+Space on macOS, your key binding on Linux) and talk; let go and it pastes. What you say to yourself or to someone else in the room is left out.
          EOF
